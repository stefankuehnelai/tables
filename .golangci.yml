version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - revive
    - staticcheck
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: dot-imports
          arguments:
            - allowed-packages:
                - "github.com/onsi/ginkgo/v2"
                - "github.com/onsi/gomega"

formatters:
  enable:
    - gofmt
    - goimports
